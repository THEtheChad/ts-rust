[workspace]
members = [
    "crates/ts_goport",
    "crates/ts_goport/parts/goport_cell",
    "crates/ts_goport/parts/goport_core",
    "crates/ts_goport/parts/goport_lsproto",
    "crates/ts_goport/parts/goport_util",
    "crates/ts_wasm",
    "tools/ts_ast_codegen",
    "tools/ts_diagnostics_codegen",
]
resolver = "3"

[workspace.package]
version = "7.0.0-dev"
edition = "2024"
license = "MIT AND Apache-2.0"
repository = "https://github.com/microsoft/typescript-go"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
redundant_clone = "warn"
# The clippy::all lints that still fire in the goport lib crates (ts_goport,
# goport_core, goport_util, goport_lsproto): the work list of the code-quality
# phase. Every other clippy::all lint is enforced everywhere (CI runs clippy
# with -D warnings); drop a line here once its lint is at zero. Narrower
# exceptions sit next to the code: generated modules allow lints at their mod
# declarations, and single sites carry their own allow with a reason. The lib
# crate roots also allow clippy::pedantic (out of scope there); bins, tests
# and tools keep it.
approx_constant = "allow"
borrowed_box = "allow"
byte_char_slices = "allow"
collapsible_match = "allow"
declare_interior_mutable_const = "allow"
default_constructed_unit_structs = "allow"
double_must_use = "allow"
enum_variant_names = "allow"
if_same_then_else = "allow"
large_enum_variant = "allow"
len_without_is_empty = "allow"
manual_clamp = "allow"
module_inception = "allow"
needless_range_loop = "allow"
never_loop = "allow"
new_without_default = "allow"
nonminimal_bool = "allow"
only_used_in_recursion = "allow"
ptr_arg = "allow"
result_large_err = "allow"
should_implement_trait = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
unnecessary_unwrap = "allow"
useless_vec = "allow"
wrong_self_convention = "allow"

# Release profile for the goport binaries: `cargo build --profile goport`.
# Binaries land in <target>/goport/. Other crates keep the default release
# settings, and the test and dev profiles (used by the regression) do not
# inherit this.
[profile.goport]
inherits = "release"
lto = "fat"
codegen-units = 1

# Size profile for the wasm build (crates/ts_wasm, scripts/wasm/build.sh):
# `cargo build --profile wasm --target wasm32-wasip1`. wasm cannot unwind,
# so panics abort. Panic messages stay.
# opt-level "z" is the smallest: 4.2 MB, where "s" with a lower inline
# limit is 5.2 MB and checks 13 to 18% faster (scripts/wasm/build.sh tells how
# to build that one).
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
